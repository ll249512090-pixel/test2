<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>校园LBS-AR游戏</title>
    <!-- 确保网页在移动设备上正常显示 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- 导入A-Frame库 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 导入AR.js库 (包含A-Frame的location-based功能) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      /* 简单的加载提示 */
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        font-size: 1.5em;
        z-index: 9999;
      }
    </style>
</head>

<body style="margin: 0; overflow: hidden">
    <!-- 加载提示，等待GPS和摄像头 -->
    <div class="loader" id="loader">
      <p>正在启动AR体验...<br/>请授权使用摄像头和位置信息。</p>
    </div>

    <!-- 
      A-Frame 场景 (a-scene)
      - vr-mode-ui: 禁用VR按钮
      - arjs: 配置AR.js
        - sourceType: webcam (使用摄像头)
        - videoTexture: true (将摄像头画面作为背景)
        - debugUIEnabled: false (隐藏调试界面)
      - renderer: 优化渲染
    -->
    <a-scene
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true"
      onload="onSceneLoad()"
    >
      <!-- 
        AR相机 (a-camera)
        - gps-camera: 这是LBS-AR的核心！它会获取设备的GPS位置。
        - rotation-reader: 辅助读取设备朝向。
      -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- 
        这就是你的AR内容！
        - gps-entity-place: 将这个物体"锚定"到现实世界的一个GPS坐标点。
          - latitude: 纬度
          - longitude: 经度
        - 我在这里使用了一个 34.12345, -118.54321 作为示例坐标。
        - 你需要把它们换成你校园中真实建筑的坐标。
        - scale: 调整物体大小，因为在真实世界中，1单位是1米。
      -->
      <a-box
        material="color: #FF6347; opacity: 0.8;"
        scale="15 15 15"
        gps-entity-place="latitude: 34.2195645; longitude: 117.1423631;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
      >
        <a-text
          value="[线索A]\n图书馆的秘密"
          color="#FFFFFF"
          align="center"
          scale="3 3 3"
          position="0 10 0"
          look-at="[gps-camera]"
        ></a-text>
      </a-box>

      <!-- 
        第二个AR内容，例如一个建筑的历史信息
        - 'look-at' 属性让文本始终朝向玩家的相机，方便阅读。
      -->
      <a-text
        value="这是校园的历史建筑一号\n始建于1920年..."
        color="#FFFFFF"
        scale="50 50 50"
        align="center"
        look-at="[gps-camera]"
        gps-entity-place="latitude: 34.12355; longitude: -118.54331;"
      ></a-text>

    </a-scene>

    <script>
      // 简单的脚本，用于在场景加载后移除加载提示
      function onSceneLoad() {
        const loader = document.getElementById('loader');
        if (loader) {
          loader.style.display = 'none';
        }
      }

      // 处理GPS权限和错误
      window.onload = () => {
        if (!navigator.geolocation) {
          alert('你的浏览器不支持GPS定位！');
          return;
        }

        navigator.geolocation.getCurrentPosition(
          (position) => {
            console.log('GPS位置获取成功:', position.coords);
          },
          (error) => {
            console.error('GPS错误:', error);
            const loader = document.getElementById('loader');
            if(error.code === 1) { // PERMISSION_DENIED
                loader.innerHTML = "<p>错误：请允许使用位置信息！<br/>没有位置权限，AR无法工作。</p>";
            } else {
                loader.innerHTML = `<p>错误：无法获取GPS位置。<br/>请确保你在室外并开启了定位服务。</p>`;
            }
          },
          {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
          }
        );
      };
    </script>
</body>
</html>
