<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Permissions-Policy" content="camera=*, geolocation=*" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>校园LBS-AR游戏</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- 导入A-Frame库 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 
      【V14/V15 关键】: 导入 AR.js 库 (Marker-Based)
      我们使用 `aframe-ar.js`，这是最稳定的标记跟踪库
    -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/main/aframe/build/aframe-ar.js"></script>

    <style>
      /* 样式保持不变 */
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        display: flex; /* 默认显示 */
        flex-direction: column; /* 垂直排列 */
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 1.2em;
        z-index: 9999;
        padding: 20px;
        box-sizing: border-box;
      }
      #startButton {
        padding: 12px 24px;
        font-size: 1.2em;
        color: #333;
        background-color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        font-weight: bold;
      }
      #startButton:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      
      /* 状态栏 */
      #statusText {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 0.9em;
        z-index: 10000;
        display: none; /* 默认隐藏 */
        box-sizing: border-box;
      }
    </style>
</head>

<body style="margin: 0; overflow: hidden">
    <!-- 
      加载提示
    -->
    <div class="loader" id="loader">
      <p>准备启动AR体验...<br/>请点击下方按钮并授权。</p>
      <button id="startButton">开始体验</button>
      <p id="errorMessage"></p> <!-- 用于显示启动错误 -->
    </div>

    <!-- 
      状态显示栏
    -->
    <div id="statusText">正在初始化...</div>

    <!-- 
      【V14/V15 核心】: 
      1. 使用 `arjs` 的默认（标记）模式。
      2. `renderer` 属性确保背景透明
    -->
    <a-scene
      id="arScene"
      style="display: none;" 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; detectionMode: mono_and_matrix; matrixCodeType: 3x3; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true;"
    >
      <!-- 
        【V14/V15 核心】: 
        我们使用 AR.js 默认的 "hiro" 标记。
        你需要打印这个标记：
        https://raw.githack.com/AR-js-org/AR.js/main/data/images/hiro.png
      -->
      <a-marker
        id="marker-1"
        type="pattern"
        url="https://raw.githack.com/AR-js-org/AR.js/main/data/patterns/pattern-hiro.patt"
      >
        <!-- 
          AR物体 (默认隐藏)
        -->
        <a-entity 
          id="target-1-group" 
          position="0 0.5 0" 
          visible="false"
          animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
        >
          <a-box
            material="color: #FF6347; opacity: 0.8;"
            scale="1 1 1"
          >
          </a-box>
          <a-text
            value="[线索A]\n图书馆的秘密"
            color="#FFFFFF"
            align="center"
            scale="0.8 0.8 0.8"
            position="0 1 0"
          ></a-text>
        </a-entity>
      </a-marker>
      
      <!-- 
        【V15 核心修复】: 
        移除了 V14 中的 <a-entity camera>。
        让 AR.js 在扫码模式下 100% 自动创建相机，
        这是解决“白屏”冲突的最后一步。
      -->
    </a-scene>

    <script>
      // 【V14/V15 核心逻辑】: 
      // 1. 保留 V12/V13 成功的“串行权限请求”逻辑。
      // 2. 增加“LBS + Marker”双重触发逻辑。
      
      // 1. 定义目标GPS坐标
      const target1 = {
        id: "target-1-group",
        lat: 34.2195645, // 你的图书馆纬度
        lng: 117.1423631, // 你的图书馆经度
        radius: 30 // 触发区域 (30米)
      };

      // 2. 计算距离的函数 (Haversine) - 保持不变
      function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // 地球半径 (米)
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const deltaP = p2 - p1;
        const deltaL = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(deltaP / 2) * Math.sin(deltaP / 2) +
                  Math.cos(p1) * Math.cos(p2) *
                  Math.sin(deltaL / 2) * Math.sin(deltaL / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; // 返回距离 (米)
      }

      // 【V14/V15 关键】: 双重触发的状态变量
      let isUserInZone = false;
      let isMarkerFound = false;
      let targetElement = null;

      // 【V14/V15 关键】: 更新AR物体可见性的函数
      function updateVisibility() {
        if (targetElement) {
          targetElement.setAttribute('visible', isUserInZone && isMarkerFound);
        }
      }

      try {
        window.onload = () => {
          const loader = document.getElementById('loader');
          const startButton = document.getElementById('startButton');
          const errorMessage = document.getElementById('errorMessage');
          const arScene = document.getElementById('arScene');
          const statusText = document.getElementById('statusText');
          const marker = document.getElementById('marker-1');
          targetElement = document.getElementById('target-1-group'); // 获取目标元素

          if (!loader || !startButton || !errorMessage || !arScene || !statusText || !marker || !targetElement) {
            console.error("CRITICAL ERROR: 页面核心元素未找到!");
            alert("页面加载出错，请刷新。");
            return;
          }

          console.log('页面加载完成，等待点击。');

          // 提前检查兼容性 (保持不变)
          if (!navigator.geolocation) {
            errorMessage.innerHTML = "错误：你的浏览器不支持GPS定位！";
            startButton.style.display = 'none';
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            errorMessage.innerHTML = "错误：你的浏览器不支持摄像头访问！";
            startButton.style.display = 'none';
            return;
          }

          // 3. "开始"按钮 -> 触发串行权限请求 (保持 V13/V14 的稳健逻辑)
          startButton.addEventListener('click', () => {
            console.log('开始按钮被点击。');
            startButton.disabled = true;
            
            // 第一步 -> 请求摄像头
            errorMessage.innerHTML = "正在请求 *摄像头* 权限...<br/>(请在浏览器弹窗中点击“允许”)";
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
              .then((stream) => {
                console.log('摄像头权限获取成功。');
                stream.getTracks().forEach(track => track.stop());
                console.log('摄像头已释放，准备请求GPS。');

                // 第二步 -> 请求GPS
                errorMessage.innerHTML = "正在请求 *GPS位置* 权限...<br/>(请在弹窗中点击“允许”)";
                
                navigator.geolocation.getCurrentPosition(
                  (position) => {
                    console.log('GPS 权限获取成功。');
                    
                    // 第三步 -> 启动AR
                    errorMessage.innerHTML = ""; 
                    loader.style.display = 'none';
                    arScene.style.display = 'block'; 
                    statusText.style.display = 'block'; 
                    
                    console.log('AR 场景已显示。AR.js将使用已获批的摄像头。');
                    
                    // 第四步 -> 启动 *持续的* GPS跟踪
                    startGpsWatch(); 
                  },
                  (err) => {
                    // GPS 权限失败
                    console.error("GPS 权限错误:", err);
                    let msg = "错误：你拒绝了 *GPS* 权限！<br/>没有GPS，LBS无法工作。请刷新重试。";
                    if (err.code === 2) msg = "错误：GPS位置不可用。";
                    if (err.code === 3) msg = "错误：GPS定位超时。";
                    errorMessage.innerHTML = msg;
                    startButton.disabled = false;
                  },
                  { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 } 
                );

              })
              .catch((err) => {
                // 摄像头权限失败
                console.error("摄像头权限错误:", err);
                errorMessage.innerHTML = "错误：你拒绝了 *摄像头* 权限！<br/>没有摄像头，AR无法工作。请刷新重试。";
                startButton.disabled = false;
              });
          });

          // 【V14/V15 关键】: 添加 Marker 事件监听
          marker.addEventListener('markerFound', () => {
            console.log('Marker Found!');
            isMarkerFound = true;
            updateVisibility();
          });

          marker.addEventListener('markerLost', () => {
            console.log('Marker Lost!');
            isMarkerFound = false;
            updateVisibility();
          });
        };

        // 4. 独立、持续的GPS跟踪
        function startGpsWatch() {
          const statusText = document.getElementById('statusText');
          statusText.innerHTML = "LBS已启动，正在持续获取位置...";

          navigator.geolocation.watchPosition(
            (position) => {
              const userLat = position.coords.latitude;
              const userLng = position.coords.longitude;
              const distance = getDistance(userLat, userLng, target1.lat, target1.lng);
              
              statusText.innerHTML = `调试信息：<br/>距离目标 [${target1.id}] Hái yǒu ${Math.round(distance)} mǐ`; // 还有 ${Math.round(distance)} 米

              // 【V14/V15 关键】: 更新 GPS 状态
              if (distance < target1.radius) {
                isUserInZone = true;
                statusText.innerHTML += "<br/>**Yǐ jìnrù mùbiāo qūyù! Qǐng sǎomiáo biāojì!**"; // **已进入目标区域！请扫描标记！**
              } else {
                isUserInZone = false;
                statusText.innerHTML += "<br/>(Yǐ líkāi mùbiāo qūyù)"; // (已离开目标区域)
              }
              
              // 【V14/V15 关键】: 每次GPS更新都检查一次是否需要显示
              updateVisibility();
            },
            (err) => {
              // GPS跟踪时出错
              console.error("GPS Watch Error:", err);
              let msg = "GPS gēnzōng diūshī："; // GPS跟踪丢失：
              if (err.code === 1) msg = "Cuòwù：GPS quánxiàn zài zhōngtú bèi chèxiāo!"; // 错误：GPS权限在中途被撤销！
              if (err.code === 2) msg = "Cuòwù：wèizhì bùkě yòng (qǐng jiǎnchá GPS huò wǎngluò)。"; // 错误：位置不可用（请检查GPS或网络）。
              if (err.code === 3) msg = "Cuòwù：GPS dìngwèi chāoshí。"; // 错误：GPS定位超时。
              statusText.innerHTML = msg;
              isUserInZone = false; // 出错了就当不在区域内
              updateVisibility();
            },
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            }
          );
        }

      } catch (e) {
        console.error("脚本全局错误:", e);
        alert("Fāshēng zhìmìng jiǎoběn cuòwù, qǐng shuāxīn：" + e.message); // 发生致命脚本错误，请刷新：
      }
    </script>
</body>
</html>
