<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Permissions-Policy" content="camera=*, geolocation=*" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>校园LBS-AR游戏</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- 导入A-Frame库 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 导入AR.js库 (包含A-Frame的location-based功能) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/main/aframe/build/aframe-ar-nft.js"></script>

    <style>
      /* 简单的加载提示 */
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        display: flex; /* 默认显示 */
        flex-direction: column; /* 垂直排列 */
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 1.2em;
        z-index: 9999;
        padding: 20px;
        box-sizing: border-box;
      }
      #startButton {
        padding: 12px 24px;
        font-size: 1.2em;
        color: #333;
        background-color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        font-weight: bold;
      }
      #errorMessage {
        color: #ffcccc;
        margin-top: 15px;
        font-size: 0.9em;
        font-weight: bold; /* 加粗错误信息 */
        line-height: 1.5; /* 增加行高 */
      }
    </style>
</head>

<body style="margin: 0; overflow: hidden">
    <!-- 
      加载提示
    -->
    <div class="loader" id="loader">
      <p>准备启动AR体验...<br/>请点击下方按钮并授权。</p>
      <button id="startButton">开始体验</button>
      
      <p id="errorMessage"></p> <!-- 用于显示错误信息 -->
    
    </div>

    <!-- 
      A-Frame 场景 (a-scene)
      默认隐藏 (display: none)，等待权限成功后再显示。
    -->
    <a-scene
      id="arScene"
      style="display: none;" 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true"
    >
      <!-- AR相机 -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- AR内容 1: 红色方块 -->
      <a-box
        material="color: #FF6347; opacity: 0.8;"
        scale="15 15 15"
        gps-entity-place="latitude: 34.2195645; longitude: 117.1423631;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
      >
        <a-text
          value="[线索A]\n图书馆的秘密"
          color="#FFFFFF"
          align="center"
          scale="3 3 3"
          position="0 10 0"
          look-at="[gps-camera]"
        ></a-text>
      </a-box>

      <!-- AR内容 2: 历史信息 -->
      <a-text
        value="这是校园的历史建筑一号\n始建于1920年..."
        color="#FFFFFF"
        scale="50 50 50"
        align="center"
        look-at="[gps-camera]"
        gps-entity-place="latitude: 34.12355; longitude: -118.54331;"
      ></a-text>

    </a-scene>

    <script>
      // 【V8 修复】: 
      // 交换权限请求顺序：1. Camera -> 2. GPS -> 3. 启动AR
      // getUserMedia (摄像头) 比 geolocation (GPS) 
      // 在触发"权限弹窗"这个动作上更稳定。
      
      try { // 包裹整个脚本
        window.onload = () => {
          const loader = document.getElementById('loader');
          const startButton = document.getElementById('startButton');
          const errorMessage = document.getElementById('errorMessage');
          const arScene = document.getElementById('arScene'); // 获取AR场景

          if (!loader || !startButton || !errorMessage || !arScene) {
            console.error("CRITICAL ERROR: 页面核心元素未找到!");
            alert("页面加载出错，请刷新。");
            return;
          }

          console.log('页面加载完成，等待点击。');

          // 检查浏览器是否支持GPS
          if (!navigator.geolocation) {
            errorMessage.innerHTML = "错误：你的浏览器不支持GPS定位！";
            startButton.style.display = 'none'; // 隐藏按钮
            return;
          }

          // 检查浏览器是否支持 camera/video
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            errorMessage.innerHTML = "错误：你的浏览器不支持摄像头访问(getUserMedia)！";
            startButton.style.display = 'none';
            return;
          }

          // 1. 为按钮添加点击事件
          startButton.addEventListener('click', () => {
            console.log('开始按钮被点击。');
            
            try {
              // --- 【V8】第1步：请求摄像头权限 ---
              errorMessage.innerHTML = "正在请求摄像头权限...<br/>(请在浏览器弹窗中点击“允许”)";
              
              navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                .then((stream) => {
                  // 摄像头权限获取成功
                  console.log('摄像头权限获取成功。');
                  // 【重要】: 立即停止流，我们只是为了预热权限
                  stream.getTracks().forEach(track => track.stop());

                  // --- 【V8】第2步：请求GPS位置 ---
                  errorMessage.innerHTML = "摄像头权限已获取。<br/>正在请求位置权限...<br/>(请再次点击“允许”)";

                  navigator.geolocation.getCurrentPosition(
                    (position) => {
                      // GPS获取成功
                      console.log('GPS位置获取成功:', position.coords);
                      
                      // --- 第3步：启动AR ---
                      console.log('权限全部成功，正在启动AR场景...');
                      loader.style.display = 'none';
                      arScene.style.display = 'block'; 

                    },
                    (geoError) => {
                      // GPS权限失败
                      console.error('GPS错误 - Code:', geoError.code, 'Message:', geoError.message);
                      
                      let msg = "错误：无法获取GPS位置。<br/>";
                      switch(geoError.code) {
                          case 1: // PERMISSION_DENIED
                              msg = "错误：你拒绝了位置权限！<br/>没有位置权限，AR无法工作。请刷新页面重试。";
                              break;
                          case 2: // POSITION_UNAVAILABLE
                              msg = "错误：位置信息不可用。<br/>请检查你的网络或GPS设置。";
                              break;
                          case 3: // TIMEOUT
                              msg = "错误：获取位置超时。<br/>请确保GPS信号良好并刷新重试。";
                              break;
                          default:
                              msg += `(错误代码: ${geoError.code}, ${geoError.message})`;
                      }
                      errorMessage.innerHTML = msg;
                    },
                    {
                      enableHighAccuracy: true,
                      timeout: 15000,
                      maximumAge: 0
                    }
                  );
                })
                .catch((camError) => {
                  // 摄像头权限失败
                  console.error('摄像头错误:', camError.name, camError.message);
                  let msg = "错误：摄像头权限被拒绝！<br/>没有摄像头，AR无法工作。请刷新重试。";
                  if (camError.name === 'NotAllowedError' || camError.name === 'PermissionDeniedError') {
                      msg = "错误：你拒绝了摄像头权限！<br/>请刷新页面并允许使用摄像头。";
                  } else if (camError.name === 'NotFoundError' || camError.name === 'NotReadableError') {
                      msg = "错误：未找到或无法读取后置摄像头。";
                  } else {
                      msg = `摄像头错误: ${camError.name}<br/>请刷新重试。`;
                  }
                  errorMessage.innerHTML = msg;
                });

            } catch (e) {
                console.error("点击事件发生意外错误:", e);
                errorMessage.innerHTML = `一个意外的错误发生: ${e.message}。请刷新页面重试。`;
            }
          });
        };
      } catch (e) {
        console.error("脚本全局错误:", e);
        alert("发生致命脚本错误，请刷新：" + e.message);
      }
    </script>
</body>
</html>
