<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Permissions-Policy" content="camera=*, geolocation=*" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>校园LBS-AR游戏</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- 导入A-Frame库 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 导入AR.js库 (包含A-Frame的location-based功能) -->
    <!-- 注意：虽然我们导入了完整的库，但我们"故意不使用"它不稳定的GPS组件 -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/main/aframe/build/aframe-ar-nft.js"></script>

    <style>
      /* 简单的加载提示 */
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        display: flex; /* 默认显示 */
        flex-direction: column; /* 垂直排列 */
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 1.2em;
        z-index: 9999;
        padding: 20px;
        box-sizing: border-box;
      }
      #startButton {
        padding: 12px 24px;
        font-size: 1.2em;
        color: #333;
        background-color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        font-weight: bold;
      }
      #startButton:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      
      /* 【V10 新增】: 一个永久显示在底部的状态栏 */
      #statusText {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 0.9em;
        z-index: 10000;
        display: none; /* 默认隐藏，启动AR后显示 */
        box-sizing: border-box;
      }
    </style>
</head>

<body style="margin: 0; overflow: hidden">
    <!-- 
      加载提示
    -->
    <div class="loader" id="loader">
      <p>准备启动AR体验...<br/>请点击下方按钮并授权。</p>
      <button id="startButton">开始体验</button>
      <p id="errorMessage"></p> <!-- 用于显示启动错误 -->
    </div>

    <!-- 
      【V10 新增】: 状态显示栏
    -->
    <div id="statusText">正在初始化...</div>

    <!-- 
      【V10 关键改动】: 
      - 不再使用 gps-camera
      - arjs 的 sourceType 只是 "webcam"
      - 这保证了AR场景本身是稳定、不会崩溃的
    -->
    <a-scene
      id="arScene"
      style="display: none;" 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true"
    >
      <!-- 【V10 关键改动】: 使用标准相机，而不是 gps-camera -->
      <a-camera a-camera-static></a-camera>

      <!-- 
        【V10 关键改动】: 
        - 移除 "gps-entity-place" (导致崩溃的根源)
        - AR物体始终在相机前 (position="0 -1 -5")
        - 默认 "visible="false"" (不可见)
        - 我们用JS根据"距离"来控制它是否可见
      -->
      <a-entity 
        id="target-1-group" 
        position="0 -1 -5" 
        visible="false"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
      >
        <a-box
          material="color: #FF6347; opacity: 0.8;"
          scale="1.5 1.5 1.5"
        >
        </a-box>
        <a-text
          id="target-1-text"
          value="[线索A]\n图书馆的秘密"
          color="#FFFFFF"
          align="center"
          scale="0.8 0.8 0.8"
          position="0 1.2 0"
        ></a-text>
      </a-entity>

    </a-scene>

    <script>
      // 【V10 核心逻辑】: 
      
      // 1. 定义目标GPS坐标
      const target1 = {
        id: "target-1-group",
        lat: 34.2195645, // 你的图书馆纬度
        lng: 117.1423631, // 你的图书馆经度
        radius: 30 // 触发区域 (30米)
      };

      // 2. 地球半径和计算距离的函数 (Haversine a.k.a 'haversine')
      function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // 地球半径 (米)
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const deltaP = p2 - p1;
        const deltaL = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(deltaP / 2) * Math.sin(deltaP / 2) +
                  Math.cos(p1) * Math.cos(p2) *
                  Math.sin(deltaL / 2) * Math.sin(deltaL / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; // 返回距离 (米)
      }

      try {
        window.onload = () => {
          const loader = document.getElementById('loader');
          const startButton = document.getElementById('startButton');
          const errorMessage = document.getElementById('errorMessage');
          const arScene = document.getElementById('arScene');
          const statusText = document.getElementById('statusText');

          if (!loader || !startButton || !errorMessage || !arScene || !statusText) {
            console.error("CRITICAL ERROR: 页面核心元素未找到!");
            alert("页面加载出错，请刷新。");
            return;
          }

          console.log('页面加载完成，等待点击。');

          // 提前检查兼容性
          if (!navigator.geolocation) {
            errorMessage.innerHTML = "错误：你的浏览器不支持GPS定位！";
            startButton.style.display = 'none';
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            errorMessage.innerHTML = "错误：你的浏览器不支持摄像头访问！";
            startButton.style.display = 'none';
            return;
          }

          // 3. "开始"按钮的唯一作用：启动AR场景
          startButton.addEventListener('click', () => {
            console.log('开始按钮被点击。');
            try {
              startButton.disabled = true;
              errorMessage.innerHTML = "正在启动AR引擎...<br/>(请注意浏览器弹出的 *摄像头* 权限申请)";

              // 隐藏加载器，显示AR场景
              loader.style.display = 'none';
              arScene.style.display = 'block'; 
              statusText.style.display = 'block'; // 显示状态栏

              console.log('AR 场景已显示。AR.js将请求 *摄像头* 权限...');
              
              // 4. AR场景启动后，我们 *独立* 启动GPS位置跟踪
              startGpsWatch();

            } catch (e) {
                console.error("点击事件发生意外错误:", e);
                statusText.innerHTML = `启动错误: ${e.message}`;
                startButton.disabled = false;
            }
          });
        };

        // 5. 独立、持续的GPS跟踪
        function startGpsWatch() {
          const statusText = document.getElementById('statusText');
          statusText.innerHTML = "正在请求 *GPS位置* 权限...<br/>(请在弹窗中点击“允许”)";

          navigator.geolocation.watchPosition(
            (position) => {
              // GPS成功获取
              const userLat = position.coords.latitude;
              const userLng = position.coords.longitude;

              // 计算距离
              const distance = getDistance(userLat, userLng, target1.lat, target1.lng);
              
              statusText.innerHTML = `调试信息：<br/>距离目标 [${target1.id}] 还有 ${Math.round(distance)} 米`;

              // 检查是否在区域内
              const targetElement = document.getElementById(target1.id);
              if (distance < target1.radius) {
                targetElement.setAttribute('visible', true);
                statusText.innerHTML += "<br/>**已进入目标区域！显示AR物体！**";
              } else {
                targetElement.setAttribute('visible', false);
              }
            },
            (err) => {
              // GPS错误
              console.error("GPS Error:", err);
              let msg = "GPS错误：";
              if (err.code === 1) msg = "错误：你拒绝了GPS位置权限！";
              if (err.code === 2) msg = "错误：位置不可用（请检查GPS或网络）。";
              if (err.code === 3) msg = "错误：GPS定位超时。";
              statusText.innerHTML = msg;
            },
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            }
          );
        }

      } catch (e) {
        console.error("脚本全局错误:", e);
        alert("发生致命脚本错误，请刷新：" + e.message);
      }
    </script>
</body>
</html>
