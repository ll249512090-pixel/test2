<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Permissions-Policy" content="camera=*, geolocation=*" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>校园LBS-AR游戏</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- 导入A-Frame库 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 导入AR.js库 -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/main/aframe/build/aframe-ar-nft.js"></script>

    <style>
      /* 简单的加载提示 */
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        display: flex; /* 默认显示 */
        flex-direction: column; /* 垂直排列 */
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 1.2em;
        z-index: 9999;
        padding: 20px;
        box-sizing: border-box;
      }
      #startButton {
        padding: 12px 24px;
        font-size: 1.2em;
        color: #333;
        background-color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        font-weight: bold;
      }
      #startButton:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      
      /* 状态栏 */
      #statusText {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 10px;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 0.9em;
        z-index: 10000;
        display: none; /* 默认隐藏 */
        box-sizing: border-box;
      }
    </style>
</head>

<body style="margin: 0; overflow: hidden">
    <!-- 
      加载提示
    -->
    <div class="loader" id="loader">
      <p>准备启动AR体验...<br/>请点击下方按钮并授权。</p>
      <button id="startButton">开始体验</button>
      <p id="errorMessage"></p> <!-- 用于显示启动错误 -->
    </div>

    <!-- 
      状态显示栏
    -->
    <div id="statusText">正在初始化...</div>

    <!-- 
      V10 稳定的AR场景 (arjs sourceType: webcam)
      【V12 修复】: 我们添加了 `renderer="colorManagement: true; alpha: true"`
      并确保 `arjs` 属性正确，`alpha: true` 是让背景透明的关键。
    -->
    <a-scene
      id="arScene"
      style="display: none;" 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true; colorManagement: true;"
    >
      <!-- 
        【V12 修复】: 
        我们不再使用 `a-camera-static`。
        我们让 AR.js 自动创建和管理相机，
        这是最稳妥的、防止“白屏”的默认方式。
      -->
      <!-- <a-camera a-camera-static></a-camera> -->

      <!-- 
        AR物体 (默认隐藏)
        【V12 修复】: 将物体放在相机内部，
        并使用 `gps-new-entity-place` (一个模拟的)
        不，还是用 V10 的方案，物体放在场景中，由JS控制。
      -->
      <a-camera></a-camera> <!-- 让 AR.js 自动接管这个相机 -->

      <a-entity 
        id="target-1-group" 
        position="0 -1 -5" 
        visible="false"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
      >
        <a-box
          material="color: #FF6347; opacity: 0.8;"
          scale="1.5 1.5 1.5"
        >
        </a-box>
        <a-text
          id="target-1-text"
          value="[线索A]\n图书馆的秘密"
          color="#FFFFFF"
          align="center"
          scale="0.8 0.8 0.8"
          position="0 1.2 0"
        ></a-text>
      </a-entity>
    </a-scene>

    <script>
      // 【V12 核心修复】: 
      // 绝对严格的串行权限请求：
      // 1. 点击按钮 -> 请求 *摄像头*
      // 2. 摄像头成功 -> 释放摄像头
      // 3. (紧接着) -> 请求 *GPS*
      // 4. GPS成功 -> 启动AR场景 (AR.js 此时再请求摄像头会 100% 成功)
      // 5. GPS成功 -> 启动 *持续的* GPS跟踪
      
      // 1. 定义目标GPS坐标
      const target1 = {
        id: "target-1-group",
        lat: 34.2195645, // 你的图书馆纬度
        lng: 117.1423631, // 你的图书馆经度
        radius: 30 // 触发区域 (30米)
      };

      // 2. 计算距离的函数 (Haversine)
      function getDistance(lat1, lon1, lat2, lon2) {
        const R = 6371e3; // 地球半径 (米)
        const p1 = lat1 * Math.PI / 180;
        const p2 = lat2 * Math.PI / 180;
        const deltaP = p2 - p1;
        const deltaL = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(deltaP / 2) * Math.sin(deltaP / 2) +
                  Math.cos(p1) * Math.cos(p2) *
                  Math.sin(deltaL / 2) * Math.sin(deltaL / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return R * c; // 返回距离 (米)
      }

      try {
        window.onload = () => {
          const loader = document.getElementById('loader');
          const startButton = document.getElementById('startButton');
          const errorMessage = document.getElementById('errorMessage');
          const arScene = document.getElementById('arScene');
          const statusText = document.getElementById('statusText');

          if (!loader || !startButton || !errorMessage || !arScene || !statusText) {
            console.error("CRITICAL ERROR: 页面核心元素未找到!");
            alert("页面加载出错，请刷新。");
            return;
          }

          console.log('页面加载完成，等待点击。');

          // 提前检查兼容性
          if (!navigator.geolocation) {
            errorMessage.innerHTML = "错误：你的浏览器不支持GPS定位！";
            startButton.style.display = 'none';
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            errorMessage.innerHTML = "错误：你的浏览器不支持摄像头访问！";
            startButton.style.display = 'none';
            return;
          }

          // 3. "开始"按钮 -> 触发串行权限请求
          startButton.addEventListener('click', () => {
            console.log('开始按钮被点击。');
            startButton.disabled = true;
            
            // 【V12 关键】: 第一步 -> 请求摄像头
            errorMessage.innerHTML = "正在请求 *摄像头* 权限...<br/>(请在浏览器弹窗中点击“允许”)";
            
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
              .then((stream) => {
                // 摄像头权限成功
                console.log('摄像头权限获取成功。');
                
                // 【V12 关键修复】: 立即停止并释放摄像头，我们只是为了要权限
                stream.getTracks().forEach(track => track.stop());
                console.log('摄像头已释放，准备请求GPS。');

                // 【V12 关键】: 第二步 -> 请求GPS (我们用 getCurrentPosition "获取" 权限)
                errorMessage.innerHTML = "正在请求 *GPS位置* 权限...<br/>(请在弹窗中点击“允许”)";
                
                navigator.geolocation.getCurrentPosition(
                  (position) => {
                    // GPS 权限也成功了
                    console.log('GPS 权限获取成功。');
                    
                    // 【V12 关键】: 第三步 -> 万事俱备，启动AR
                    errorMessage.innerHTML = ""; // 清空错误
                    loader.style.display = 'none';
                    arScene.style.display = 'block'; // 启动AR场景
                    statusText.style.display = 'block'; // 显示状态栏
                    
                    console.log('AR 场景已显示。AR.js将使用已获批的摄像头。');
                    
                    // 【V12 关键】: 第四步 -> 启动 *持续的* GPS跟踪
                    startGpsWatch(); 
                  },
                  (err) => {
                    // GPS 权限失败
                    console.error("GPS 权限错误:", err);
                    let msg = "错误：你拒绝了 *GPS* 权限！<br/>没有GPS，LBS无法工作。请刷新重试。";
                    if (err.code === 2) msg = "错误：GPS位置不可用。";
                    if (err.code === 3) msg = "错误：GPS定位超时。";
                    errorMessage.innerHTML = msg;
                    startButton.disabled = false; // 允许重试
                  },
                  { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 } // 延长超时
                );

              })
              .catch((err) => {
                // 摄像头权限失败
                console.error("摄像头权限错误:", err);
                errorMessage.innerHTML = "错误：你拒绝了 *摄像头* 权限！<br/>没有摄像头，AR无法工作。请刷新重试。";
                startButton.disabled = false;
              });
          });
        };

        // 4. 独立、持续的GPS跟踪 (这个函数现在只在权限都OK后才被调用)
        function startGpsWatch() {
          const statusText = document.getElementById('statusText');
          statusText.innerHTML = "LBS已启动，正在持续获取位置...";

          navigator.geolocation.watchPosition(
            (position) => {
              // GPS成功获取
              const userLat = position.coords.latitude;
              const userLng = position.coords.longitude;

              // 计算距离
              const distance = getDistance(userLat, userLng, target1.lat, target1.lng);
              
              statusText.innerHTML = `调试信息：<br/>距离目标 [${target1.id}] 还有 ${Math.round(distance)} 米`;

              // 检查是否在区域内
              const targetElement = document.getElementById(target1.id);
              if (distance < target1.radius) {
                targetElement.setAttribute('visible', true);
                statusText.innerHTML += "<br/>**已进入目标区域！显示AR物体！**";
              } else {
                targetElement.setAttribute('visible', false);
              }
            },
            (err) => {
              // GPS跟踪时出错 (比如中途关闭了GPS)
              console.error("GPS Watch Error:", err);
              let msg = "GPS跟踪丢失：";
              if (err.code === 1) msg = "错误：GPS权限在中途被撤销！";
              if (err.code === 2) msg = "错误：位置不可用（请检查GPS或网络）。";
              if (err.code === 3) msg = "错误：GPS定位超时。";
              statusText.innerHTML = msg;
            },
            {
              enableHighAccuracy: true,
              timeout: 10000,
              maximumAge: 0
            }
          );
        }

      } catch (e) {
        console.error("脚本全局错误:", e);
        alert("发生致命脚本错误，请刷新：" + e.message);
      }
    </script>
</body>
</html>
