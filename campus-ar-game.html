<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="Permissions-Policy" content="camera=*, geolocation=*" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>校园LBS-AR游戏</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />

    <!-- 导入A-Frame库 -->
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    
    <!-- 导入AR.js库 (包含A-Frame的location-based功能) -->
    <script src="https://raw.githack.com/AR-js-org/AR.js/main/aframe/build/aframe-ar-nft.js"></script>

    <style>
      /* 简单的加载提示 */
      .loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        color: white;
        display: flex; /* 默认显示 */
        flex-direction: column; /* 垂直排列 */
        justify-content: center;
        align-items: center;
        text-align: center;
        font-family: Arial, sans-serif;
        font-size: 1.2em;
        z-index: 9999;
        padding: 20px;
        box-sizing: border-box;
      }
      #startButton {
        padding: 12px 24px;
        font-size: 1.2em;
        color: #333;
        background-color: #fff;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
        font-weight: bold;
      }
      /* 按钮被禁用时的样式 */
      #startButton:disabled {
        background-color: #ccc;
        cursor: not-allowed;
      }
      #errorMessage {
        color: #ffcccc;
        margin-top: 15px;
        font-size: 0.9em;
        font-weight: bold; /* 加粗错误信息 */
        line-height: 1.5; /* 增加行高 */
      }
    </style>
</head>

<body style="margin: 0; overflow: hidden">
    <!-- 
      加载提示
    -->
    <div class="loader" id="loader">
      <p>准备启动AR体验...<br/>请点击下方按钮并授权。</p>
      <button id="startButton">开始体验</button>
      
      <p id="errorMessage"></p> <!-- 用于显示错误信息 -->
    
    </div>

    <!-- 
      A-Frame 场景 (a-scene)
      默认隐藏 (display: none)，等待用户点击后再显示。
      当它被显示时，AR.js 和 gps-camera 应该会自动触发权限请求。
    -->
    <a-scene
      id="arScene"
      style="display: none;" 
      vr-mode-ui="enabled: false"
      arjs="sourceType: webcam; videoTexture: true; debugUIEnabled: false;"
      renderer="antialias: true; alpha: true"
    >
      <!-- AR相机 -->
      <a-camera gps-camera rotation-reader></a-camera>

      <!-- AR内容 1: 红色方块 -->
      <a-box
        material="color: #FF6347; opacity: 0.8;"
        scale="15 15 15"
        gps-entity-place="latitude: 34.2195645; longitude: 117.1423631;"
        animation="property: rotation; to: 0 360 0; loop: true; dur: 10000"
      >
        <a-text
          value="[线索A]\n图书馆的秘密"
          color="#FFFFFF"
          align="center"
          scale="3 3 3"
          position="0 10 0"
          look-at="[gps-camera]"
        ></a-text>
      </a-box>

      <!-- AR内容 2: 历史信息 -->
      <a-text
        value="这是校园的历史建筑一号\n始建于1920年..."
        color="#FFFFFF"
        scale="50 50 50"
        align="center"
        look-at="[gps-camera]"
        gps-entity-place="latitude: 34.12355; longitude: -118.54331;"
      ></a-text>

    </a-scene>

    <script>
      // 【V9 修复】: 
      // 策略变更：不再手动请求权限。
      // 我们让用户点击按钮，按钮的唯一作用是“取消隐藏”AR场景。
      // AR.js 库 (arjs 和 gps-camera) 在场景被激活时，
      // 应该会自动、且更稳定地处理权限请求。
      
      try {
        window.onload = () => {
          const loader = document.getElementById('loader');
          const startButton = document.getElementById('startButton');
          const errorMessage = document.getElementById('errorMessage');
          const arScene = document.getElementById('arScene');

          if (!loader || !startButton || !errorMessage || !arScene) {
            console.error("CRITICAL ERROR: 页面核心元素未找到!");
            alert("页面加载出错，请刷新。");
            return;
          }

          console.log('页面加载完成，等待点击。');

          // 提前检查兼容性，如果浏览器根本不支持，就提示
          if (!navigator.geolocation) {
            errorMessage.innerHTML = "错误：你的浏览器不支持GPS定位！<br/>（此功能无法在此浏览器上运行）";
            startButton.style.display = 'none';
            return;
          }
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
            errorMessage.innerHTML = "错误：你的浏览器不支持摄像头访问！<br/>（此功能无法在此浏览器上运行）";
            startButton.style.display = 'none';
            return;
          }

          // 1. 为按钮添加点击事件
          startButton.addEventListener('click', () => {
            console.log('开始按钮被点击。');
            
            try {
              // 【V9 关键修复】: 立即禁用按钮，防止“双击”导致崩溃
              startButton.disabled = true;
              errorMessage.innerHTML = "正在启动AR引擎...<br/>(请注意浏览器弹出的权限申请)";

              // 【V9 关键策略】: 
              // 1. 隐藏加载界面
              // 2. 显示AR场景
              // 现在，让 A-Frame 和 AR.js 库自己去处理权限请求。
              loader.style.display = 'none';
              arScene.style.display = 'block'; 

              console.log('AR 场景已显示。等待 AR.js 触发权限请求...');

            } catch (e) {
                console.error("点击事件发生意外错误:", e);
                errorMessage.innerHTML = `一个意外的错误发生: ${e.message}。请刷新页面重试。`;
                startButton.disabled = false; // 允许重试
            }
          });
        };
      } catch (e) {
        console.error("脚本全局错误:", e);
        alert("发生致命脚本错误，请刷新：" + e.message);
      }
    </script>
</body>
</html>
